  }
  function startIntro() {
    playShow(introBeats(), 'Rivera Royale show intro', () => {
      introSeen = true;
      store.set(LS_INTRO, '1');
      go({ name: 'home' });
    });
  }

  /* The ending: a winner and the credits, as if that were all. Then the lights go out, and the
     lowest roller of the night is called up for a surprise nobody was told about. */
  function endingBeats() {
    const P = state.players, f = state.finale;
    const done = P.filter(p => p.status !== 'waiting').sort((a, b) => worth(b) - worth(a) || a.at - b.at);
    const topAmt = done.length ? worth(done[0]) : 0;
    const tops = done.filter(p => worth(p) === topAmt).map(p => p.name);
    const given = done.reduce((sum, p) => sum + worth(p), 0);
    const bill = `<div class="bill"><small>Pamasko</small>${peso(STAKE)}</div>`;
    const cr = (role, who) => `<p class="cr"><small>${esc(role)}</small>${[].concat(who).map(w => `<b>${esc(w)}</b>`).join('')}</p>`;
    const credits = `<div class="credits"><div class="credits-roll">${logoHTML()}
      ${cr('Created and hosted by', 'RJ')}${cr('Pinaka-poging pinsan at pamangkin', 'RJ (ayon kay RJ)')}${cr('Head of finance', 'RJ’s wallet')}
      ${cr('Starring', P.map(p => p.name))}
      ${cr('Dice wrangler', 'Kapalaran')}${cr('Wheel operator', 'Swerte')}${cr('Catering', 'Whoever cooked. Salamat po!')}${cr('Built with', 'Claude')}
      <p class="cr"><small>No Titos or Titas were harmed in the making of this show</small></p>
      ${cr('Maligayang Pasko', String(new Date().getFullYear()))}</div></div>`;
    const beats = [
      { kicker: 'That’s the show', big: 'Tonight’s big winner is…', sound: 'drumroll', soundFor: 1800,
        vo: 'And that is our show, everybody! But before we go... tonight’s big winner is...' },
      { kicker: 'Tonight’s big winner', big: list(tops), foil: true, art: `<div class="winner">${CROWN}<span>${peso(topAmt)}</span></div>`, sound: 'fanfare', party: true,
        vo: `${list(tops)}! With ${num(topAmt)} pesos!` },
      { kicker: 'Tonight RJ gave away', big: peso(given), foil: true, art: `<div class="fan">${bill}${bill}${bill}</div>`,
        vo: `Tonight, RJ gave away ${num(given)} pesos. Please clap. He will be eating instant noodles until February.` },
      { kicker: 'From all of us at Rivera Royale', big: 'Maligayang Pasko!', art: logoHTML(), sound: 'fanfare',
        vo: 'From all of us at Rivera Royale... Maligayang Pasko! Good night, everybody!' },
      { html: credits, hold: 16500, sound: 'jackpot' },
    ];
    const tied = f.pending ? f.pending.ids.map(player).filter(Boolean) : null;
    const low = tied ? tied[0] : player(f.picked[0]);
    if (!low) return beats;       // nobody rolled, so there is nothing more to reveal
    beats.push(
      { dark: true, html: '<span></span>', hold: 3000, sound: 'none' },
      { dark: true, cls: 'flicker', big: 'But wait…', sound: 'rumble', vo: 'But wait.' },
      { dark: true, kicker: 'Did you think RJ was done?', big: 'There’s one more.', foil: true, art: `<div class="bagbig">${ICON_BAG}</div>`,
        vo: 'Did you really think RJ was done? There is one more thing.' },
      { dark: true, kicker: 'Somebody in this room', big: 'Had the worst luck tonight.', art: `<div class="flats"><div class="flat zero"><span>${peso(0)}</span></div></div>`,
        vo: 'Somebody in this room had the worst luck of the night. The lowest roll. The saddest dice.' },
      { dark: true, kicker: 'The lowest roll of the night', big: 'Belongs to…', sound: 'drumroll', soundFor: 2400,
        vo: 'The lowest roll of the night belongs to...' },
      tied
        ? { dark: true, kicker: `${peso(low.total)} each`, big: 'It’s a tie!', foil: true, sound: 'fanfare',
            vo: `A tie! ${list(tied.map(p => p.name))}, with ${num(low.total)} pesos each. One die each. The lowest roll steps into the spotlight.` }
        : { dark: true, kicker: peso(low.total), big: low.name, foil: true, sound: 'fanfare', party: true,
            vo: `${low.name}! With ${num(low.total)} pesos.` }
    );
    return beats;
  }
  function startEnding() {
    if (!state.finale || state.finale.stage === 'revealed') return;
    playShow(endingBeats(), 'The end of the show', () => {
      commit(s => { if (s.finale) s.finale.stage = 'revealed'; });
      go({ name: 'finale' });
      setTimeout(announceOffer, 700);
    });
  }

  /* ================= The roll ================= */
  let shake = null;              // dice being rattled while the screen is held down

  function startShake(root) {
    if (shake || busy) return;
    const cubes = [...root.querySelectorAll('.cube')];
    root.classList.add('is-shaking');
    const still = reduceMotion();
    const tick = () => {
      if (!still) cubes.forEach(c => {
        const rx = +c.dataset.rx + 70 + Math.random() * 110, ry = +c.dataset.ry + 70 + Math.random() * 110;
        c.dataset.rx = rx; c.dataset.ry = ry;
        c.style.transition = 'transform 150ms linear';
        c.style.transform = `rotateY(0deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
      });
      knock(0, 0.14 + Math.random() * 0.2); knock(0.06 + Math.random() * 0.04, 0.1 + Math.random() * 0.2);
    };
    tick();
    buzz(12);
    shake = { root, timer: setInterval(tick, 140) };
  }
  function stopShake() {
    if (!shake) return;
    clearInterval(shake.timer);
    shake.root.classList.remove('is-shaking');
    shake = null;
  }

  // The nearest angle that shows the wanted side after at least `turns` more full spins.
  const spinTo = (from, base, turns) => base + 360 * Math.ceil((from + 360 * turns - base) / 360);

  function countTo(el, from, to, ms, done) {
    if (from === to || ms <= 0 || reduceMotion()) { el.textContent = peso(to); if (done) done(); return; }
    const t0 = performance.now();
    let lastTick = 0;
    (function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      el.textContent = peso(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      if (now - lastTick > 70 && k < 1) { sfx.tick(); lastTick = now; }
      if (k < 1) requestAnimationFrame(step); else if (done) done();
    })(t0);
  }

  function playRoll(p) {
    busy = true;
    const root = $app.querySelector('.roll'), tray = root.querySelector('.tray');
    const amt = root.querySelector('.total-amt'), label = root.querySelector('.score-label');
    const dice = [...root.querySelectorAll('.die')];
    const still = reduceMotion();
    // When each die comes to rest. The third stops on an edge first, then tips over.
    const T = still ? [200, 500, 900] : [1300, 2100, 3300];
    let shown = 0;

    const viaPhone = root.classList.contains('via-phone');
    const boost = Math.round(throwPower * 2);     // a harder throw from the phone spins the dice more
    throwPower = 0;
    root.classList.remove('is-ready', 'is-shaking', 'phone-shaking');
    root.classList.add('is-rolling');
    root.removeAttribute('data-action');
    root.querySelectorAll('.back, .roll-cta, .in-phone').forEach(el => el.remove());
    if (viaPhone && !still) dice.forEach((el, i) => {
      el.style.setProperty('--fx', `${(1 - i) * 110}%`);      // they come in together from below, as if from the hand
      el.style.animation = `flyin 560ms ${i * 60}ms cubic-bezier(.2, .8, .3, 1) both`;
    });
    tellPhone();
    label.textContent = 'so far';
    amt.classList.remove('stake');
    amt.classList.add('foil');
    amt.textContent = peso(0);
    if (!still) { sfx.whoosh(); rattle(T[1]); }
    buzz(40);

    const closeTurn = big => setTimeout(() => { busy = false; ui.fresh = { id: p.id, at: 0 }; render(); }, big ? 600 : 250);

    const land = i => {
      const el = dice[i], star = isStar(p, i), side = DICE[i].faces[p.faces[i]];
      el.classList.remove('rolling', 'teeter-x', 'teeter-y');
      el.classList.add('settled', 'landed');
      if (star) el.classList.add('is-star');
      if (side === 0) el.classList.add('is-zero');
      el.querySelector('.readout').textContent = sideLabel(side);
      tray.classList.remove('bump'); void tray.offsetWidth; tray.classList.add('bump');
      sfx.land(); buzz(25);
      link.send({ t: 'buzz', p: 30 });
      if (star && i < 2) { sfx.star(); fx.at(el, { n: 26, power: 8, spread: 6.3, gravity: 0.22, life: 55, size: 7, colors: fx.golds() }); }
      if (i < 2) { countTo(amt, shown, shown + p.dice[i], 380); shown += p.dice[i]; }
    };

    const finish = () => {
      tray.classList.remove('suspense');
      land(2);
      root.classList.remove('is-rolling');
      if (p.wheel) { openWheel(p, root, tray, amt, label, shown, closeTurn); return; }
      const jackpot = isStar(p, 2), bust = p.dice[2] === 0;
      label.textContent = 'takes home';
      setTimeout(() => voice.say(lines.result(p)), jackpot ? 900 : 350);
      if (jackpot) {
        root.classList.add('is-jackpot');
        sfx.jackpot(); buzz([60, 40, 60, 40, 220]); bigShow();
        countTo(amt, shown, p.total, 1500, () => closeTurn(true));
      } else if (bust) {
        sfx.bust(); buzz(140);
        countTo(amt, shown, p.total, 0, () => closeTurn(false));
      } else {
        if (isStar(p, 0) || isStar(p, 1) || p.total >= 200) { sfx.star(); fx.at(tray, { n: 60, power: 14 }); }
        countTo(amt, shown, p.total, 500, () => closeTurn(false));
      }
    };

    dice.forEach((el, i) => {
      const cube = el.querySelector('.cube');
      const [bx, by] = FACE_ROT[p.faces[i]];
      const rx = spinTo(+cube.dataset.rx, bx, 3 + i + boost), ry = spinTo(+cube.dataset.ry, by, 2 + i + boost);
      // Die 3 pauses on an edge, tilted 45 degrees toward one of its four neighbours picked at
      // random (the extra 16/18 degrees cancel the camera angle so both sides show equally).
      let tipX = 0, tipY = 0;
      if (i === 2 && !still) {
        const way = Math.random() < 0.5 ? 1 : -1;
        if (Math.random() < 0.5) tipX = 45 * way + 16; else tipY = 45 * way + 18;
      }
      const pose = (tx, ty) => `rotateY(${ty}deg) rotateX(${rx + tx}deg) rotateY(${ry}deg)`;
      el.style.setProperty('--dur', T[i] + 'ms');
      el.classList.add('rolling');
      cube.getBoundingClientRect();          // commit the current pose before the tumble begins
      cube.style.transition = still ? 'none' : `transform ${T[i]}ms cubic-bezier(.12, .72, .2, 1)`;
      cube.style.transform = pose(tipX, tipY);
      if (i < 2) { setTimeout(() => land(i), T[i] + 40); return; }

      setTimeout(() => {
        const tr = tray.getBoundingClientRect(), dr = el.querySelector('.die-stage').getBoundingClientRect();
        tray.style.setProperty('--sx', ((dr.left + dr.width / 2 - tr.left) / tr.width * 100).toFixed(1) + '%');
        tray.style.setProperty('--sy', ((dr.top + dr.height / 2 - tr.top) / tr.height * 100).toFixed(1) + '%');
        tray.classList.add('suspense');
        if (!still) sfx.drumroll(T[2] - T[1] + 900);
      }, T[1] + 160);
      setTimeout(() => {
        if (still) { finish(); return; }
        el.classList.remove('rolling');
        el.classList.add(tipX ? 'teeter-x' : 'teeter-y');   // balanced on an edge...
        setTimeout(() => {                   // ...and over it goes
          cube.style.transition = 'transform 420ms cubic-bezier(.5, 0, .3, 1.35)';
          cube.style.transform = pose(0, 0);
          setTimeout(finish, 430);
        }, 620);
      }, T[2] + 40);
    });
  }

  /** Turn a wheel of n wedges to the angle `end`, slowing down, with a click as each peg passes the pointer. */
  function runWheel(rotEl, pin, n, end, done) {
    if (reduceMotion()) { rotEl.style.transform = `rotate(${end}deg)`; done(); return; }
    sfx.whoosh(); buzz(30);
    const a = 360 / n, D = 6200, t0 = performance.now();
    let last = -1;
    (function step(now) {
      const t = Math.min(1, (now - t0) / D), th = end * (1 - Math.pow(1 - t, 4));
      rotEl.style.transform = `rotate(${th}deg)`;
      const under = Math.floor(((((-th) % 360) + 360) % 360) / a);
      if (under !== last) {
        if (last !== -1) { sfx.peg(); pin.style.transform = 'rotate(-16deg)'; setTimeout(() => { pin.style.transform = ''; }, 70); }
        last = under;
      }
      if (t < 1) requestAnimationFrame(step); else setTimeout(done, 250);
    })(t0);
  }

  /* The third die opened the roulette: swap the tray for the wheel and wait for a spin.
     The prize was fixed and saved with the dice; the spin only reveals it. */
  function openWheel(p, root, tray, amt, label, soFar, closeTurn) {
    banner('Roulette!', `${p.name}, spin the wheel`, 1500);
    sfx.fanfare(); buzz([40, 40, 40]);
    voice.say(lines.wheelOpen(p.name));
    setTimeout(() => {
      tray.insertAdjacentHTML('afterend', wheelWrapHTML(p, false));
      tray.remove();
      const wrap = root.querySelector('.wheel-wrap'), wheel = wrap.querySelector('.wheel'), btn = wrap.querySelector('.spin-btn');
      const rotEl = wrap.querySelector('.wheel-rot'), pin = wrap.querySelector('.wheel-pin');
      let spun = false;

      const settle = () => {
        const w = p.wheel.won, cashWon = cashOf(w);
        wheel.classList.remove('ready');
        wheel.classList.add('done');
        const wedges = [...wrap.querySelectorAll('.wedge')];
        wedges[p.wheel.slots.indexOf(w)].classList.add('won');
        const chip = wrap.querySelector('.wheel-dice .wheelchip');
        if (chip) chip.outerHTML = wheelChip(p);
        label.textContent = 'takes home';
        setTimeout(() => voice.say(lines.wheel(p)), 500);
        if (w === BAGWIN || cashWon >= 500) {
          root.classList.add('is-jackpot');
          sfx.jackpot(); buzz([60, 40, 60, 40, 220]); bigShow();
          if (w === BAGWIN) { banner('Jackpot!', 'The Mystery Bag', 1900); amt.insertAdjacentHTML('afterend', '<span class="total-plus">+ the Mystery Bag</span>'); }
          countTo(amt, soFar, p.total, 1500, () => closeTurn(true));
        } else if (cashWon === 0) {
          sfx.bust(); buzz(140);
          countTo(amt, soFar, p.total, 0, () => closeTurn(false));
        } else {
          sfx.star(); fx.at(wheel, { n: 60, power: 14 });
          countTo(amt, soFar, p.total, 600, () => closeTurn(false));
        }
      };

      const spin = power => {
        if (spun) return;
        spun = true;
        wheelWaiting = null;
        tellPhone();
        if (btn) btn.remove();
        wrap.querySelectorAll('.hint').forEach(h => h.remove());
        wheel.classList.remove('ready');
        const n = p.wheel.slots.length;
        const end = 360 * (5 + Math.round((typeof power === 'number' ? power : 0.5) * 3)) + restAngle(p.wheel);   // a harder pull, more turns
        runWheel(rotEl, pin, n, end, settle);
      };
      wheel.addEventListener('click', spin);
      if (btn) btn.addEventListener('click', spin);
      wheelWaiting = spin;
      tellPhone();
    }, reduceMotion() ? 300 : 1250);
  }

  /* ================= The finale ================= */
  /** Give the next Mystery Bag offer to the lowest roller who doesn't have one, or set up a roll-off for a tie. */
  function pickLowest(s) {
    const f = s.finale, pool = bagPool(s);
    if (!pool.length) return;
    const group = pool.filter(p => p.total === pool[0].total);
    f.slots += 1;
    if (group.length === 1) f.picked.push(group[0].id);
    else f.pending = { ids: group.map(p => p.id), slots: 1 };
  }
  function startFinale(s) {
    s.finale = { stage: 'credits', slots: 0, picked: [], pending: null, rounds: [], decisions: {} };
    pickLowest(s);
  }

  /** One roll-off round: everyone still tied rolls a die, lowest rolls take the open spots. */
  function rollOff(s) {
    const f = s.finale, pend = f.pending, k = pend.slots;
    const rolls = {};
    pend.ids.forEach(id => { rolls[id] = rollFace() + 1; });
    const order = pend.ids.slice().sort((a, b) => rolls[a] - rolls[b]);
    const cut = rolls[order[k - 1]];
    let winners, tied;
    if (cut < rolls[order[k]]) { winners = order.slice(0, k); tied = []; }
    else { winners = order.filter(id => rolls[id] < cut); tied = order.filter(id => rolls[id] === cut); }
    f.rounds.push({ ids: pend.ids.slice(), slots: k, rolls, in: winners, tied });
    f.picked.push(...winners);
    f.pending = tied.length ? { ids: tied, slots: k - winners.length } : null;
  }

  // Call out whoever has just been handed the Mystery Bag question.
  function announceOffer() {
    const f = state.finale;
    if (!f || f.pending || route.name !== 'finale') return;
    const p = player(f.picked.find(id => !f.decisions[id]));
    if (p) { banner(p.name, 'Pera o Mystery Bag?', 1700); voice.say(lines.lowest(p.name, p.total)); }
  }

  function playRollOff() {
    const n = state.finale.rounds.length - 1;
    ui.animRound = n;
    render();
    const done = () => {
      busy = false; ui.animRound = -1; render(); sfx.land(); buzz(30);
      $app.querySelectorAll(`[data-round="${n}"] .contender.in`).forEach(el => fx.at(el, { n: 18, power: 7, spread: 6.3, gravity: 0.2, life: 50, size: 6, colors: fx.golds() }));
      setTimeout(announceOffer, 700);
    };
    if (reduceMotion()) { done(); return; }
    busy = true;
    sfx.drumroll(1000);
    const dice = [...$app.querySelectorAll(`[data-round="${n}"] .pip-die`)];
    const finals = dice.map(d => d.innerHTML);
    const tick = setInterval(() => dice.forEach(d => { d.innerHTML = pipCells(1 + Math.floor(Math.random() * 6)); }), 80);
    setTimeout(() => { clearInterval(tick); dice.forEach((d, i) => { d.innerHTML = finals[i]; }); setTimeout(done, 350); }, 1000);
    const card = $app.querySelector(`[data-round="${n}"]`);
    if (card && card.scrollIntoView) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  /* ================= The dice phone =================
     A second phone can be the dice: shake it, make a throwing motion, and the dice fly onto the
     big screen. The big screen stays in charge of the game; the phone only says "shaking" and
     "thrown". The two talk directly to each other (WebRTC, introduced by the public PeerJS
     service), which a page inside Claude is not allowed to do, so this runs on the game's own
     web address only. */
  const QS = new URLSearchParams(window.location.search);
  const PAIR = hasHost ? '' : (QS.get('pair') || '').replace(/\D/g, '').slice(0, 5);   // set on the phone: the big screen's code
  const LINK_VIA = QS.get('link') || '';            // for testing: "local" (same browser) or "host:port" (own PeerServer)
  const canLink = !hasHost && (LINK_VIA === 'local' || typeof window.RTCPeerConnection === 'function');
  const loadScript = src => new Promise((ok, bad) => {
    const el = document.createElement('script');
    el.src = src; el.onload = () => ok(); el.onerror = () => bad(new Error('could not load ' + src));
    document.head.appendChild(el);
  });

  const link = (() => {
    let status = 'off', role = '', code = '', wanted = false, peer = null, conn = null, chan = null, timer = 0, watchdog = 0;
    let onMsg = () => {}, onStatus = () => {};
    const set = st => { if (st !== status) { status = st; onStatus(st); } };
    const peerId = c => 'rivera-royale-' + c;
    const peerOpts = () => {
      if (!LINK_VIA || LINK_VIA === 'local') return {};
      const [host, port] = LINK_VIA.split(':');
      return { host, port: +port || 9000, path: '/', secure: false };
    };

    function lost(c) {
      if (c && conn !== c) return;
      conn = null;
      if (!wanted) return;
      set('waiting');
      clearTimeout(timer);
      if (role === 'phone') timer = setTimeout(dial, 1500);
    }
    function adopt(c) {
      conn = c;
      c.on('open', () => { clearTimeout(watchdog); set('on'); if (role === 'phone') c.send({ t: 'hello' }); });
      c.on('data', m => { if (m && typeof m === 'object' && conn === c) onMsg(m); });
      c.on('close', () => lost(c));
      c.on('error', () => lost(c));
    }
    function dial() {
      if (!wanted || !peer || peer.destroyed || (conn && conn.open)) return;
      if (peer.disconnected) { try { peer.reconnect(); } catch (e) { /* try again below */ } }
      let c;
      try { c = peer.connect(peerId(code), { reliable: true }); } catch (e) { lost(null); return; }
      if (!c) { lost(null); return; }
      adopt(c);
      clearTimeout(watchdog);
      watchdog = setTimeout(() => { if (conn === c && !c.open) { try { c.close(); } catch (e) { /* gone */ } lost(c); } }, 9000);
    }
    function open() {
      if (!wanted) return;
      try { if (peer) peer.destroy(); } catch (e) { /* already gone */ }
      conn = null;
      peer = role === 'tablet' ? new window.Peer(peerId(code), peerOpts()) : new window.Peer(peerOpts());
      peer.on('open', () => { set('waiting'); if (role === 'phone') dial(); });
      peer.on('connection', c => {
        if (role !== 'tablet') return;
        if (conn && conn !== c) { const old = conn; conn = null; try { old.close(); } catch (e) { /* gone */ } }
        adopt(c);
      });
      peer.on('disconnected', () => { if (wanted) { try { peer.reconnect(); } catch (e) { /* retried on error */ } } });
      peer.on('error', e => {
        const type = e && e.type;
        clearTimeout(timer);
        if (type === 'peer-unavailable') lost(null);                              // the big screen isn't listening yet
        else if (type === 'unavailable-id') timer = setTimeout(open, 2500);       // our earlier self is still registered
        else if (wanted && status !== 'on') { set('failed'); timer = setTimeout(open, 4000); }
      });
    }
    // A same-browser link, used only to test the two halves against each other.
    function openLocal() {
      chan = new BroadcastChannel('rivera-royale-' + code);
      const mine = chan;
      chan.onmessage = e => {
        const m = e.data;
        if (!m || m.from === role) return;
        if (m.t === 'hello' && role === 'tablet') { const fresh = status !== 'on'; set('on'); chan.postMessage({ from: role, t: 'welcome' }); if (!fresh) return; }
        if (m.t === 'welcome') { if (role === 'phone') set('on'); return; }
        onMsg(m);
      };
      set('waiting');
      // The phone keeps saying hello, so a big screen that was refreshed finds it again.
      if (role === 'phone') (function knockOn() { if (wanted && chan === mine) { chan.postMessage({ from: role, t: 'hello' }); setTimeout(knockOn, status === 'on' ? 1000 : 300); } })();
    }

    return {
      status: () => status,
      onMessage(fn) { onMsg = fn; },
      onStatus(fn) { onStatus = fn; },
      async start(asRole, withCode) {
        this.stop();
        role = asRole; code = withCode; wanted = true;
        set('connecting');
        if (LINK_VIA === 'local') { openLocal(); return; }
        try { if (!window.Peer) await loadScript(PEER_SRC); } catch (e) { set('failed'); return; }
        open();
      },
      stop() {
        wanted = false;
        clearTimeout(timer); clearTimeout(watchdog);
        try { if (peer) peer.destroy(); } catch (e) { /* already gone */ }
        try { if (chan) chan.close(); } catch (e) { /* already gone */ }
        peer = null; conn = null; chan = null;
        set('off');
      },
      send(msg) {
        if (status !== 'on') return;
        try { if (chan) chan.postMessage(Object.assign({ from: role }, msg)); else if (conn && conn.open) conn.send(msg); } catch (e) { /* dropped; the next one will do */ }
      },
    };
  })();

  /* ---- on the big screen ---- */
  let wheelWaiting = null;       // the spin, while the wheel waits for someone to set it going
  let throwPower = 0;            // how hard the last throw came in from the phone, 0..1
  let shakeCalm = 0, eyeOff = 0, lastTold = '';
  const phoneOn = () => !PAIR && link.status() === 'on';
  function pairCode() {
    let c = store.get(LS_PAIR) || '';
    if (!/^\d{5}$/.test(c)) { c = Array.from({ length: 5 }, () => randInt(10)).join(''); store.set(LS_PAIR, c); }
    return c;
  }
  const pairUrl = () => `${window.location.origin}${window.location.pathname}?pair=${pairCode()}${LINK_VIA ? '&link=' + encodeURIComponent(LINK_VIA) : ''}`;
  function qrSVG(text) {
    const qr = window.qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg class="qr" viewBox="-2 -2 ${n + 4} ${n + 4}" role="img" aria-label="QR code that connects the dice phone"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  function startPhoneLink() {
    if (!canLink) return;
    store.set(LS_LINK, 'on');
    link.start('tablet', pairCode());
    if (!ui.qr) loadScript(QR_SRC).then(() => { ui.qr = qrSVG(pairUrl()); if (!busy && route.name === 'home') render(); }).catch(() => { /* the address is shown as text too */ });
  }
  function stopPhoneLink() {
    store.set(LS_LINK, 'off');
    link.stop();
  }
  const phonePill = () => {
    const st = link.status();
    if (PAIR || !canLink || st === 'off') return '';
    return `<span class="pill ${st === 'on' ? 'ok' : st === 'failed' ? 'warn' : 'busy'}">Dice phone</span>`;
  };

  /** Keep the phone's screen in step with the big screen. It is told what is happening, never what is coming. */
  function tellPhone(force) {
    if (!phoneOn()) return;
    const p = route.id ? player(route.id) : null, f = state.finale;
    const waiting = f ? [] : state.players.filter(x => x.status === 'waiting');
    let stage = 'lobby', who = null;
    if (showing) stage = 'show';
    else if (route.name === 'finale') {
      stage = 'show';
      if (f && f.stage === 'revealed' && !busy) {
        const q = f.pending ? null : player(f.picked.find(id => !f.decisions[id]));
        if (f.pending) stage = 'rolloff';
        else if (q) { stage = 'offer'; who = q; }
      }
    } else if (route.name === 'pick') stage = busy ? 'rolling' : 'pick';
    else if (route.name === 'choice' && p) { stage = 'choice'; who = p; }
    else if (route.name === 'roll' && p) { stage = wheelWaiting ? 'wheel' : busy ? 'rolling' : p.status === 'rolled' ? 'result' : 'ready'; who = p; }
    const amount = who && (stage === 'result' || stage === 'offer') ? who.total : null;
    const msg = { t: 'stage', stage, name: who ? who.name : '', total: amount, bag: stage === 'result' && wonBag(who), left: waiting.length, last: waiting.length === 1 ? waiting[0].name : '' };
    const key = JSON.stringify(msg);
    if (!force && key === lastTold) return;
    lastTold = key;
    link.send(msg);
  }
  function fromPhone(m) {
    if (m.t === 'hello') { tellPhone(true); return; }
    const stage = $app.querySelector('.roll.is-ready');
    const p = route.id ? player(route.id) : null;
    if (m.t === 'shake') {
      if (!stage || busy) return;
      const e = Math.max(0, Math.min(1, +m.e || 0));
      stage.classList.toggle('phone-shaking', e > 0.06);
      if (e > 0.1) knock(0, 0.1 + e * 0.3);
      clearTimeout(shakeCalm);
      shakeCalm = setTimeout(() => stage.classList.remove('phone-shaking'), 500);
    } else if (m.t === 'throw') {
      const power = Math.max(0, Math.min(1, +m.p || 0.5));
      if (wheelWaiting) { wheelWaiting(power); return; }       // a pull on the phone spins the wheel that is waiting
      if (!stage || busy) return;
      throwPower = power;
      actions.roll();
    } else if (m.t === 'eye') {
      // The player has a finger on an answer but hasn't locked it in: show the room what they are eyeing.
      clearTimeout(eyeOff);
      $app.querySelectorAll('.eyed').forEach(d => d.classList.remove('eyed'));
      const target = m.what === 'pera' ? $app.querySelector('.choice .door:not(.fate)')
        : m.what === 'cash' || m.what === 'bag' ? $app.querySelector(`.offer:not(.done) [data-choice="${m.what}"]`) : null;
      if (target) { target.classList.add('eyed'); sfx.tick(); eyeOff = setTimeout(() => target.classList.remove('eyed'), 4600); }
    } else if (m.t === 'do' && !busy && !showing) {
      const at = { dataset: { id: p ? p.id : '' } };
      if (m.what === 'pick' && route.name === 'home') actions.pick();
      else if (m.what === 'home' && route.name === 'roll' && p && p.status === 'rolled') actions.home();
      else if (m.what === 'kapalaran' && route.name === 'choice' && p) actions['to-roll'](at);
      else if (m.what === 'pera' && route.name === 'choice' && p) actions.keep(at);
      else if (m.what === 'roll-off' && route.name === 'finale') actions['roll-off']();
      else if ((m.what === 'cash' || m.what === 'bag') && route.name === 'finale' && state.finale && !state.finale.pending) {
        const id = state.finale.picked.find(x => !state.finale.decisions[x]), card = $app.querySelector('.offer:not(.done)');
        if (id && card) actions.decide({ dataset: { id, choice: m.what }, closest: () => card });
      }
    }
  }
  function phoneLinkChanged() {
    if (link.status() === 'on') { lastTold = ''; tellPhone(true); }
    if (!busy) render();
  }

  /* ---- on the phone ---- */
  // The phone is the player's controller: it picks Pera or Kapalaran, pulls the wheels, and
  // shakes and throws the dice. Everything it does is a request; the big screen runs the game.
  function startController() {
    document.title = 'Rivera Royale dice';
    const SHAKE_ON = 6, SHAKE_OFF = 2.6;      // m/s2 of movement, gravity taken out
    const el = document.createElement('main');
    el.className = 'ctl';
    $app.appendChild(el);
    let stage = { stage: 'lobby', name: '', total: null, bag: false, left: 0, last: '' };
    let active = false, thrown = false, sawMotion = false, giveUp = 0;
    let armed = '', armedAt = 0, armTimer = 0, note = null, noteTimer = 0, pull = null;
    let energy = 0, quick = 0, peak = 0, peakAtCalm = 0, work = 0, shakeFrom = 0, calmFrom = 0, lastAt = 0, lastSent = 0, grav = null;

    // A big two-tap choice: the first tap asks "final answer?", the second locks it in.
    const choice = (what, label, sub, cls) => `<button class="ctl-pick ${cls}${armed === what ? ' armed' : ''}" type="button" data-ctl="${what}"><b>${armed === what ? 'Final answer?' : esc(label)}</b><span>${armed === what ? 'Tap again to lock it in' : esc(sub)}</span></button>`;
    const pullHTML = `<div class="pull"><div class="pull-track"><div class="pull-fill"></div><div class="pull-knob">${ICON_WHEEL}</div></div><div class="pull-arrows" aria-hidden="true"><i></i><i></i><i></i></div></div>`;

    function paint() {
      const st = link.status(), s = stage;
      let kicker = 'Dice phone', name = '', big = '', sub = '', btn = null, mid = '', quiet = null;
      if (!PAIR) { big = 'This link is missing its code'; sub = 'Scan the QR code on the big screen again.'; }
      else if (st !== 'on') {
        big = st === 'failed' ? 'Can’t reach the big screen' : 'Connecting to the big screen…';
        sub = st === 'failed' ? 'Check that both devices are online. Still trying.' : `Code ${PAIR}`;
      } else if (!active) { big = 'Ready when you are'; sub = 'This phone picks, pulls, shakes and throws. The big screen shows it.'; btn = ['activate', 'Start']; }
      else if (note) { kicker = note.kicker || kicker; big = note.big; sub = note.sub; }
      else if (s.stage === 'choice') {
        name = s.name; kicker = 'Pera o Kapalaran?';
        mid = `<div class="ctl-picks">${choice('pera', 'Pera', `Take ${peso(STAKE)} cash`, 'cash')}<button class="ctl-pick fate" type="button" data-ctl="kapalaran"><b>Kapalaran</b><span>Roll the dice</span></button></div>`;
      } else if (s.stage === 'ready') {
        name = s.name;
        mid = `<div class="ctl-dice">${DICE.map((d, i) => dieHTML(i, null, 'ctl-die')).join('')}</div><div class="ctl-meter"><i></i></div>`;
        big = thrown ? 'Look at the big screen!' : 'Shake… then throw!';
        sub = thrown ? '' : sawMotion ? 'Shake hard, swing toward the big screen, and stop.' : 'If shaking does nothing, use the button.';
        btn = thrown ? null : ['throw', 'Throw'];
      } else if (s.stage === 'wheel' || s.stage === 'pick') {
        name = s.stage === 'wheel' ? s.name : '';
        kicker = s.stage === 'wheel' ? 'The roulette' : 'Who’s next?';
        big = thrown ? 'Look at the big screen!' : 'Pull down to spin!';
        mid = thrown ? '' : pullHTML;
        quiet = thrown ? null : ['throw', 'Or tap to spin'];
      } else if (s.stage === 'rolling') { name = s.name; big = 'Look at the big screen!'; }
      else if (s.stage === 'result') { name = s.name; kicker = 'takes home'; big = peso(s.total || 0) + (s.bag ? ' + the Mystery Bag' : ''); btn = ['home', 'Pass it on']; }
      else if (s.stage === 'offer') {
        name = s.name; kicker = 'Pera o Mystery Bag?';
        mid = `<div class="ctl-picks">${choice('cash', `Keep ${peso(s.total || 0)}`, 'Walk away with the cash', 'cash')}${choice('bag', 'Mystery Bag', `Hand back the ${peso(s.total || 0)}`, 'fate')}</div>`;
      } else if (s.stage === 'rolloff') { kicker = 'A tie'; big = 'Roll off!'; btn = ['roll-off', 'Roll the tie-breaker']; }
      else if (s.stage === 'show') { big = 'Watch the big screen'; }
      else if (s.left > 0) { kicker = 'Who’s next?'; big = s.left === 1 ? `Last up: ${s.last}` : 'Next player'; btn = ['pick', s.left === 1 ? `Call ${s.last}` : 'Spin for the next player']; }
      else { big = 'Wait for the host'; sub = 'Nothing to do here just now.'; }
      el.className = `ctl at-${st === 'on' ? s.stage : 'off'}${thrown ? ' is-thrown' : ''}`;
      el.innerHTML = `<div class="ctl-top">${PAROL}<span>Rivera <em class="foil">Royale</em></span><span class="pill ${st === 'on' ? 'ok' : st === 'failed' ? 'warn' : 'busy'}">${st === 'on' ? 'Connected' : st === 'failed' ? 'Offline' : 'Connecting'}</span></div>
        <div class="ctl-body">
          <p class="ctl-kicker">${esc(kicker)}</p>
          ${name ? `<h1 class="ctl-name foil">${esc(name)}</h1>` : ''}
          ${mid}
          ${big ? `<p class="ctl-big">${esc(big)}</p>` : ''}
          ${sub ? `<p class="note">${esc(sub)}</p>` : ''}
          ${quiet ? `<button class="btn quiet" type="button" data-ctl="${quiet[0]}">${quiet[1]}</button>` : ''}
        </div>
        ${btn ? `<button class="btn primary big wide" type="button" data-ctl="${btn[0]}">${esc(btn[1])}</button>` : '<span></span>'}`;
    }

    function disarm(tell) {
      clearTimeout(armTimer);
      if (!armed) return;
      armed = '';
      if (tell) link.send({ t: 'eye', what: '' });
    }
    function say(big, sub, kicker, ms) {     // a short message of the phone's own, over whatever the big screen is doing
      note = { big, sub, kicker };
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => { note = null; paint(); }, ms || 2600);
      paint();
    }

    function doThrow(power) {
      if (thrown || link.status() !== 'on') return;
      thrown = true;
      link.send({ t: 'throw', p: +power.toFixed(2) });
      buzz(60);
      sfx.whoosh();
      el.classList.add('is-thrown');
      setTimeout(paint, 400);
      // If the big screen wasn't ready for it, hand control back after a moment.
      clearTimeout(giveUp);
      const was = stage.stage;
      giveUp = setTimeout(() => { if (thrown && stage.stage === was) { thrown = false; paint(); } }, 3000);
    }

    function onMotion(ev) {
      if (!active) return;
      const now = performance.now(), dt = Math.min(100, now - (lastAt || now));
      lastAt = now;
      let x, y, z;
      const a = ev.acceleration;
      if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
      else {
        const g = ev.accelerationIncludingGravity;
        if (!g || g.x == null) return;
        grav = grav || { x: g.x, y: g.y, z: g.z };          // a slow average stands in for gravity
        grav.x += (g.x - grav.x) * 0.08; grav.y += (g.y - grav.y) * 0.08; grav.z += (g.z - grav.z) * 0.08;
        x = g.x - grav.x; y = g.y - grav.y; z = g.z - grav.z;
      }
      const mag = Math.hypot(x, y, z);
      if (mag > 1.5 && !sawMotion) { sawMotion = true; if (stage.stage === 'ready' && !thrown) paint(); }
      energy = Math.max(mag, energy * Math.exp(-dt / 160));     // smooth, for the meter and the big screen
      quick = Math.max(mag, quick * Math.exp(-dt / 60));        // fast, to catch the instant the hand stops
      peak = Math.max(mag, peak * Math.exp(-dt / 500));         // how hard the last swing was
      // Only the dice are thrown by moving the phone; the wheels are pulled on the screen.
      if (stage.stage !== 'ready' || thrown || link.status() !== 'on') { shakeFrom = 0; work = 0; calmFrom = 0; return; }
      if (quick > SHAKE_ON && !shakeFrom) { shakeFrom = now; work = 0; }
      if (shakeFrom) {
        work += mag * dt / 1000;
        if (quick >= SHAKE_OFF) calmFrom = 0;
        else {
          if (!calmFrom) { calmFrom = now; peakAtCalm = peak; }
          // The throw is the moment the shaking stops: a real swing ends with the hand held still.
          if (now - calmFrom > 130) {
            const ok = calmFrom - shakeFrom > 450 && work > 4;
            shakeFrom = 0; calmFrom = 0; work = 0;
            if (ok) doThrow(Math.max(0.25, Math.min(1, peakAtCalm / 32)));
            else link.send({ t: 'shake', e: 0 });
            return;
          }
        }
      }
      if (shakeFrom && now - lastSent > 70) {
        lastSent = now;
        link.send({ t: 'shake', e: +Math.min(1, energy / 26).toFixed(2) });
        if (energy > 8) knock(0, 0.12 + Math.min(0.3, energy / 80));
      }
    }

    el.addEventListener('click', e => {
      const b = e.target.closest('[data-ctl]');
      if (!b) return;
      const what = b.dataset.ctl;
      if (what === 'activate') {
        active = true;
        audio();
        try { if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') DeviceMotionEvent.requestPermission().catch(() => {}); } catch (err) { /* not needed here */ }
        buzz(30);
        paint();
      } else if (what === 'throw') doThrow(0.6);
      else if (what === 'pera' || what === 'cash' || what === 'bag') {
        if (armed !== what) {                       // first tap: ask, and let the big screen show what is being considered
          clearTimeout(armTimer);
          armed = what; armedAt = Date.now();
          link.send({ t: 'eye', what });
          buzz(20);
          armTimer = setTimeout(() => { disarm(true); paint(); }, 4500);
          paint();
        } else if (Date.now() - armedAt > 400) {    // second tap, and not an accidental double tap
          disarm(false);
          link.send({ t: 'do', what });
          buzz([40, 40, 90]);
          if (what === 'pera') say('Pera!', `${peso(STAKE)} cash. Collect it from RJ.`, stage.name);
          else if (what === 'bag') say('Mystery Bag!', 'Look at the big screen.', stage.name);
          else say('Cash it is', 'Look at the big screen.', stage.name);
        }
      } else { disarm(true); link.send({ t: 'do', what }); buzz(30); }
    });

    // Pulling the handle down spins whichever wheel is on the big screen.
    el.addEventListener('pointerdown', e => {
      const zone = e.target.closest('.pull');
      if (!zone || thrown) return;
      const knob = zone.querySelector('.pull-knob'), track = zone.querySelector('.pull-track');
      pull = { id: e.pointerId, zone, knob, y0: e.clientY, dy: 0, max: Math.max(40, track.clientHeight - knob.offsetHeight), lastY: e.clientY, lastT: performance.now(), v: 0 };
      try { zone.setPointerCapture(e.pointerId); } catch (err) { /* fine without capture */ }
      zone.classList.add('pulling');
    });
    el.addEventListener('pointermove', e => {
      if (!pull || e.pointerId !== pull.id) return;
      const now = performance.now(), dt = now - pull.lastT;
      if (dt > 8) { pull.v = (e.clientY - pull.lastY) / dt; pull.lastY = e.clientY; pull.lastT = now; }
      pull.dy = Math.max(0, Math.min(pull.max, e.clientY - pull.y0));
      pull.knob.style.transform = `translateY(${pull.dy.toFixed(1)}px)`;
      pull.zone.style.setProperty('--pull', (pull.dy / pull.max).toFixed(3));
    });
    const endPull = (e, cancelled) => {
      if (!pull || (e && e.pointerId !== pull.id)) return;
      const far = pull.dy / pull.max, fast = Math.max(0, pull.v);
      pull.zone.classList.remove('pulling');
      pull.knob.style.transform = '';
      pull.zone.style.setProperty('--pull', '0');
      pull = null;
      if (!cancelled && (far > 0.45 || (far > 0.2 && fast > 0.7))) doThrow(Math.max(0.3, Math.min(1, far * 0.6 + fast * 0.35)));
    };
    el.addEventListener('pointerup', e => endPull(e, false));
    el.addEventListener('pointercancel', e => endPull(e, true));
    window.addEventListener('devicemotion', onMotion);

    // The dice on the phone rattle with the hand.
    (function frame() {
      const e = Math.min(1, energy / 26);
      el.querySelectorAll('.ctl-die').forEach(d => {
        d.style.transform = e > 0.04 ? `translate(${((Math.random() - 0.5) * e * 30).toFixed(1)}px, ${((Math.random() - 0.5) * e * 30).toFixed(1)}px) rotate(${((Math.random() - 0.5) * e * 44).toFixed(1)}deg)` : '';
      });
      const bar = el.querySelector('.ctl-meter i');
      if (bar) bar.style.width = Math.round(e * 100) + '%';
      if (performance.now() - lastAt > 300) energy *= 0.85;      // no sensor news: let the dice settle
      requestAnimationFrame(frame);
    })();

    link.onMessage(m => {
      if (m.t === 'buzz') { buzz(m.p); return; }
      if (m.t !== 'stage') return;
      const changed = m.stage !== stage.stage || m.name !== stage.name;
      stage = m;
      if (changed) {
        disarm(false);
        pull = null;
        clearTimeout(giveUp);
        thrown = m.stage === 'rolling';
        if (m.stage === 'result') buzz(m.bag || m.total >= 500 ? [60, 40, 60, 40, 220] : 40);
      }
      if (!pull) paint();
    });
    link.onStatus(paint);
    paint();
    if (PAIR && canLink) link.start('phone', PAIR);
  }

  /* ================= Actions ================= */
  const actions = {
    home() { go({ name: 'home' }, true); },
    sound() {
      soundOn = !soundOn;
      store.set(LS_SOUND, soundOn ? 'on' : 'off');
      if (soundOn) bell(880, 0, 0.3, 0.15); else voice.stop();
      const btn = document.getElementById('sound-btn');
      if (btn) { btn.setAttribute('aria-pressed', soundOn); btn.innerHTML = soundOn ? ICON_SOUND : ICON_MUTE; }
    },
    full() {
      try {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else document.documentElement.requestFullscreen().catch(() => {});
      } catch (e) { /* not allowed here */ }
    },
    intro() { startIntro(); },
    'phone-on'() { startPhoneLink(); render(); },
    'phone-off'() { stopPhoneLink(); render(); },
    voice(el) { voice.setName(el.dataset.voice); render(); voice.say(lines.test()); },
    'voice-source'(el) { voice.setSource(el.dataset.source); render(); voice.say(lines.test()); },
    'voice-test'() { voice.say(lines.test()); },
    turn(el) {
      const p = player(el.dataset.id);
      go({ name: 'choice', id: el.dataset.id });
      if (p && route.name === 'choice') { sfx.slam(); voice.say(lines.turn(p.name)); }
    },
    // Who goes next is left to a wheel of the waiting names.
    pick() {
      const waiting = state.players.filter(p => p.status === 'waiting');
      if (!waiting.length || state.finale) return;
      if (waiting.length === 1) { actions.turn({ dataset: { id: waiting[0].id } }); return; }
      go({ name: 'pick' });
      sfx.slam();
      voice.say(lines.pickOpen());
    },
    'pick-spin'(power) {
      const wrap = $app.querySelector('.pick');
      const waiting = state.players.filter(p => p.status === 'waiting');
      if (busy || !wrap || !waiting.length) return;
      const n = waiting.length, k = randInt(n), a = 360 / n;       // every waiting name is equally likely
      const wheel = wrap.querySelector('.wheel');
      busy = true;
      wheelWaiting = null;
      tellPhone();
      wrap.querySelectorAll('.back, .hint, button[data-action="pick-spin"]').forEach(el => el.remove());
      wheel.classList.remove('ready');
      const end = 360 * (4 + Math.round((typeof power === 'number' ? power : 0.5) * 3)) - (k + 0.5 + (Math.random() * 0.6 - 0.3)) * a;
      runWheel(wrap.querySelector('.wheel-rot'), wrap.querySelector('.wheel-pin'), n, end, () => {
        wheel.classList.add('done');
        wrap.querySelectorAll('.wedge')[k].classList.add('won');
        sfx.fanfare(); buzz([40, 40, 80]);
        link.send({ t: 'buzz', p: [40, 40, 80] });
        fx.at(wheel, { n: 50, power: 13 });
        setTimeout(() => { busy = false; actions.turn({ dataset: { id: waiting[k].id } }); }, 1300);
      });
    },
    'to-roll'(el) {
      const p = player(el.dataset.id);
      if (p) { banner('Kapalaran!', null, 950); voice.say(lines.fate(p.name)); }
      go({ name: 'roll', id: el.dataset.id });
    },
    keep(el) {
      const id = el.dataset.id, p = player(id);
      if (!p || p.status !== 'waiting') return;
      if (!commit(s => Object.assign(s.players.find(x => x.id === id), { status: 'kept', total: STAKE, at: Date.now(), r: RULES }))) return;
      banner('Pera!', `RJ hands ${p.name} ${peso(STAKE)}`, 2000);
      bell(659.25, 0, 0.4, 0.15); bell(783.99, 0.12, 0.5, 0.15);
      voice.say(lines.pera(p.name));
      ui.fresh = { id, at: 0 };
      go({ name: 'home' }, true);
    },
    roll() {
      if (busy) return;
      stopShake();
      const p = player(route.id);
      if (!p || p.status !== 'waiting' || state.finale) return;
      const faces = [rollFace(), rollFace(), rollFace()];
      const sides = faces.map((fc, i) => DICE[i].faces[fc]);
      // The third die may open the roulette. Its prize is drawn now, from what is still on the wheel.
      let wheel = null;
      if (sides[2] === SPIN) {
        const slots = wheelNow(state);
        wheel = { slots, won: slots[randInt(slots.length)], j: Math.round((Math.random() * 0.6 - 0.3) * 100) / 100 };
      }
      const dice = sides.map((v, i) => (i === 2 && wheel ? cashOf(wheel.won) : v));
      const total = dice.reduce((a, b) => a + b, 0);
      // Everything is saved the instant the dice are let go; the tumble and the spin only reveal it.
      const saved = commit(s => {
        const q = s.players.find(x => x.id === p.id);
        Object.assign(q, { status: 'rolled', faces, dice, total, at: Date.now(), r: RULES });
        if (wheel) q.wheel = wheel; else delete q.wheel;
      });
      if (saved) playRoll(player(p.id));
    },
    redo(el) {
      const id = el.dataset.id;
      commit(s => { const p = s.players.find(x => x.id === id); if (p && !s.finale) { Object.assign(p, { status: 'waiting', faces: null, dice: null, total: null }); delete p.wheel; delete p.r; } });
      render();
    },
    remove(el) {
      const id = el.dataset.id;
      commit(s => { if (!s.finale) s.players = s.players.filter(x => x.id !== id); });
      render();
    },
    'clear-results'() {
      commit(s => {
        s.finale = null;
        s.players.forEach(p => { Object.assign(p, { status: 'waiting', faces: null, dice: null, total: null }); delete p.wheel; delete p.r; });
      });
      go({ name: 'home' });
    },
    reset() {
      commit(s => { if (s.players.length) s.lastRoster = s.players.map(p => p.name); s.players = []; s.finale = null; });
      go({ name: 'home' });
    },
    'restore-names'() {
      const back = Array.isArray(state.lastRoster) ? state.lastRoster : [];
      if (!back.length || state.players.length) return;
      commit(s => {
        s.players = back.map((name, i) => ({ id: newId() + i, name, status: 'waiting', faces: null, dice: null, total: null, at: Date.now() + i }));
        delete s.lastRoster;
      });
      render();
    },
    'start-finale'() {
      if (state.finale || !state.players.some(p => p.status !== 'waiting')) return;
      if (commit(startFinale)) { go({ name: 'finale' }); startEnding(); }
    },
    finale() { go({ name: 'finale' }); startEnding(); },
    credits() { startEnding(); },
    'undo-finale'() { commit(s => { s.finale = null; }); render(); },
    'roll-off'() {
      if (!state.finale || !state.finale.pending) return;
      if (commit(rollOff)) playRollOff();
    },
    'offer-next'() {
      const f = state.finale;
      if (!f || f.pending || f.slots >= 2 || !bagPool(state).length) return;
      if (!commit(pickLowest)) return;
      render();
      banner('And one more…', 'Nobody won the roulette Jackpot', 2000);
      voice.say(lines.oneMore()).then(spoke => setTimeout(announceOffer, spoke ? 300 : 2300));
    },
    decide(el) {
      const { id, choice } = el.dataset;
      const f = state.finale, p = player(id);
      if (!f || f.pending || f.decisions[id] || !p) return;
      const took = choice === 'bag';
      const card = el.closest('.offer');
      if (!commit(s => { s.finale.decisions[id] = took ? 'bag' : 'cash'; })) return;
      if (took) { sfx.star(); fx.at(card, { n: 70, power: 15 }); banner('Mystery Bag!', p.name, 1600); }
      const settled = () => !!state.finale && state.finale.picked.every(x => state.finale.decisions[x]);
      const wasLast = settled();
      voice.say(took ? lines.tookBag(p.name) : lines.keptCash(p.name)).then(spoke => { if (wasLast && settled()) setTimeout(() => voice.say(lines.goodbye()), spoke ? 400 : 2500); });
      render();
    },
  };

  function addPlayer() {
    const input = document.getElementById('new-name');
    if (!input) return;
    const typed = input.value.split(/[,;\n]+/).map(n => n.replace(/\s+/g, ' ').trim().slice(0, 24)).filter(Boolean);
    if (!typed.length) { input.focus(); return; }
    const have = new Set(state.players.map(p => p.name.toLowerCase())), fresh = [], dup = [];
    typed.forEach(n => { const k = n.toLowerCase(); if (have.has(k)) dup.push(n); else { have.add(k); fresh.push(n); } });
    if (!fresh.length) {
      ui.addError = `${list(dup)} ${dup.length > 1 ? 'are' : 'is'} already on the list. Add an initial to tell them apart.`;
      render();
      return;
    }
    if (!commit(s => fresh.forEach((name, i) => s.players.push({ id: newId() + i, name, status: 'waiting', faces: null, dice: null, total: null, at: Date.now() + i })))) return;
    ui.addError = dup.length ? `Skipped ${list(dup)}: already on the list.` : '';
    input.value = '';
    render();
  }

  /* Two-tap confirm for anything that can't be taken back (the page can't show confirm dialogs). */
  let armedAt = 0;
  function disarm(el) {
    clearTimeout(el._timer);
    if (!el.isConnected || !el.classList.contains('armed')) return;
    el.classList.remove('armed');
    el.innerHTML = el._label;
  }
  function arm(el) {
    $app.querySelectorAll('.armed').forEach(disarm);
    el._label = el.innerHTML;
    el.classList.add('armed');
    el.textContent = el.dataset.confirm;
    armedAt = Date.now();
    el._timer = setTimeout(() => disarm(el), 4500);
  }

  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    if (busy && el.dataset.action !== 'sound' && el.dataset.action !== 'full') return;      // let the dice finish first
    if (el.dataset.confirm) {
      if (!el.classList.contains('armed')) { arm(el); return; }
      if (Date.now() - armedAt < 400) return;   // ignore an accidental double tap
    }
    const run = actions[el.dataset.action];
    if (run) run(el);
  });
  $app.addEventListener('submit', e => {
    if (e.target.id === 'add-form') { e.preventDefault(); addPlayer(); }
  });
  $app.addEventListener('toggle', e => {
    const c = e.target.classList;
    if (c && c.contains('host')) ui.hostOpen = e.target.open;
    if (c && c.contains('sides-info')) ui.sidesOpen = e.target.open;
  }, true);

  // Press and hold to rattle the dice; letting go throws them. A plain tap is a quick throw.
  $app.addEventListener('pointerdown', e => {
    const stage = e.target.closest('.roll.is-ready');
    if (!stage || e.button > 0 || e.target.closest('.back')) return;
    startShake(stage);
  });
  window.addEventListener('pointerup', () => { if (shake) actions.roll(); });
  window.addEventListener('pointercancel', stopShake);
  $app.addEventListener('contextmenu', e => { if (e.target.closest('.roll')) e.preventDefault(); });

  // Keep the screen awake while the tablet is passed around, where the browser allows it.
  let wake = null;
  async function stayAwake() {
    try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { /* fine without it */ }
  }
  document.addEventListener('pointerdown', stayAwake, { passive: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wake === null) stayAwake(); });

  if (!hasHost && QS.has('pair')) {
    startController();                       // this device is the dice
  } else {
    link.onMessage(fromPhone);
    link.onStatus(phoneLinkChanged);
    render();
    if (hasHost) connect();
    voice.init();
    if (canLink && store.get(LS_LINK) === 'on') startPhoneLink();
  }
})();
</script>
</body>
</html>
