      init, say, script, stop, guess, NAMES, kind,
      sources: () => [tts ? 'claude' : '', hasDevice() ? 'device' : ''].filter(Boolean),
      setSource(k) { source = k === 'device' ? 'device' : 'claude'; store.set(LS_SOURCE, source); stop(); },
      hasFilipino: () => !!filVoice,
      blocked: () => blocked,
      talking: () => talking,
      name: () => name,
      setName(n) { if (NAMES.includes(n)) { name = n; store.set(LS_VOICE, n); } },
      describe() {
        if (blocked) return 'Reading aloud is switched off for this page. Turn it back on in the page’s Permissions menu.';
        const k = kind();
        if (k === 'claude') return filCode
          ? 'A Claude voice announces the show, and its Filipino voice reads the Tagalog sentences.'
          : 'A Claude voice announces the show. It is an English voice, so Tagalog words come out with an accent.';
        if (k === 'device') return filVoice
          ? `This device’s Filipino voice (${filVoice.name}) announces the show.`
          : 'This device’s English voice announces the show. To hear Tagalog read properly, install a Filipino voice in the device’s text-to-speech settings, then reopen this page.';
        return 'No voice is available in this app, so the lines appear as big text only. For the voiceover, open this page in Chrome.';
      },
    };
  })();

  // What the announcer says. Short, warm, a little cheeky.
  const lines = {
    pickOpen: () => oneOf(['Who’s next? Spin the wheel.', 'Let’s see who’s up next. Spin it!', 'Next player. The wheel decides.']),
    turn: n => oneOf([`${n}! Pera... o kapalaran?`, `${n}, come on down! Pera... o kapalaran?`, `Next up, ${n}. One question. Pera... o kapalaran?`]),
    pera: n => oneOf([`Pera! Smart. Boring... but smart. RJ, three hundred pesos for ${n}, please.`, `${n} takes the money and runs! Three hundred pesos. RJ, pay up.`, `Pera it is. Three hundred pesos, safe and sound. Wise choice, ${n}.`]),
    fate: n => oneOf([`Kapalaran! Brave. Let's see what fate thinks of ${n}.`, `Kapalaran! Give those dice a good shake, ${n}.`, `Kapalaran it is! No take-backs now.`]),
    result(p) {
      const n = p.name, t = num(p.total);
      if (isStar(p, 2)) return oneOf([`One thousand pesos! ${n} takes home ${t} pesos! RJ... are you okay?`, `The thousand! ${t} pesos for ${n}! Somebody check on RJ's wallet.`]);
      if (p.dice[2] === 0) return oneOf([`Ooh. The last die says zero. ${t} pesos for ${n}. We still love you.`, `Zero on the last die. ${n} takes home ${t} pesos. It's the thought that counts.`]);
      if (p.total >= 200) return oneOf([`${t} pesos! Not bad at all, ${n}.`, `${t} pesos for ${n}. That's a very respectable roll.`]);
      if (p.total >= 130) return oneOf([`${t} pesos for ${n}. Enough for merienda.`, `${n} takes home ${t} pesos. Could be worse.`]);
      return oneOf([`${t} pesos. Well... kapalaran has spoken, ${n}.`, `${n} takes home ${t} pesos. Don't spend it all in one place.`]);
    },
    wheelOpen: n => oneOf([`Roulette! ${n}, step up and spin the wheel.`, `It's the roulette! Spin it, ${n}. Anything can happen.`]),
    wheel(p) {
      const n = p.name, t = num(p.total), w = p.wheel.won;
      if (w === BAGWIN) return `Jackpot! ${n} wins the Mystery Bag! Nobody knows what's inside... except RJ.`;
      if (w === 0) return `The wheel says... zero. Ouch. ${t} pesos for ${n}.`;
      if (w >= 500) return `${num(w)} pesos from the wheel! ${n} takes home ${t} pesos!`;
      return `${num(w)} pesos from the wheel. That makes ${t} pesos for ${n}.`;
    },
    lowest: (n, t) => `${n}. You can keep your ${num(t)} pesos... or trade them for this Mystery Bag. Nobody knows what's inside. Pera... o Mystery Bag?`,
    oneMore: () => 'And one more thing. Nobody won the roulette jackpot tonight... so that Mystery Bag is still on the table.',
    tookBag: n => `The bag! Brave. Nobody knows what's inside... except RJ. Good luck, ${n}.`,
    keptCash: n => `${n} keeps the cash. Fair enough.`,
    goodbye: () => 'And now... that really is our show. Maligayang Pasko, Rivera family!',
    test: () => 'Mga Tito, mga Tita. Welcome to Rivera Royale! [tl]Si RJ, ang pinaka-poging pinsan at pamangkin ninyo, ay may inihandang simpleng palaro.[/tl] Pera... o kapalaran?',
  };

  /* ================= Confetti and sparks ================= */
  const fx = (() => {
    let cv = null, ctx = null, parts = [], running = false, dpr = 1, palette = null;
    const colors = () => palette || (palette = ['--gold', '--gold-light', '--ivory', '--orange', '--ruby-light', '--violet', '--blue']
      .map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim()));
    function frame() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      const floor = cv.height + 60;
      parts = parts.filter(p => p.life > 0 && p.y < floor);
      for (const p of parts) {
        p.vy += p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 1;
        ctx.globalAlpha = Math.min(1, p.life / 24);
        ctx.fillStyle = p.c;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2.4, 0, 6.2832); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      }
      if (parts.length) requestAnimationFrame(frame);
      else { cv.remove(); cv = null; running = false; }
    }
    function burst(o) {
      if (reduceMotion()) return;
      if (!cv) {
        cv = document.createElement('canvas');
        cv.className = 'confetti';
        document.body.appendChild(cv);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(window.innerWidth * dpr);
        cv.height = Math.round(window.innerHeight * dpr);
        ctx = cv.getContext('2d');
      }
      const cols = o.colors || colors();
      const scale = dpr * Math.max(1, Math.min(window.innerWidth, window.innerHeight) / 420);   // bigger screen, bigger party
      const angle = o.angle == null ? -Math.PI / 2 : o.angle, spread = o.spread == null ? Math.PI : o.spread;
      for (let i = 0; i < o.n; i++) {
        const a = angle + (Math.random() - 0.5) * spread, v = (o.power || 12) * (0.4 + Math.random() * 0.8) * scale;
        parts.push({
          x: o.x * dpr, y: o.y * dpr, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          g: (o.gravity == null ? 0.45 : o.gravity) * scale, s: (o.size || 9) * (0.6 + Math.random() * 0.8) * scale,
          r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.45,
          c: cols[Math.floor(Math.random() * cols.length)], round: Math.random() < 0.3,
          life: (o.life || 110) * (0.7 + Math.random() * 0.6),
        });
      }
      if (!running) { running = true; requestAnimationFrame(frame); }
    }
    const at = (el, o) => { const r = el.getBoundingClientRect(); burst(Object.assign({ x: r.left + r.width / 2, y: r.top + r.height / 2 }, o)); };
    return { burst, at, golds: () => colors().slice(0, 3) };
  })();

  function flash() {
    if (reduceMotion()) return;
    const el = document.createElement('div');
    el.className = 'flash';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
  function bigShow() {
    const W = window.innerWidth, H = window.innerHeight;
    flash();
    fx.burst({ x: 0, y: H, angle: -Math.PI / 3, spread: 0.8, n: 120, power: 27, life: 190 });
    fx.burst({ x: W, y: H, angle: -2 * Math.PI / 3, spread: 0.8, n: 120, power: 27, life: 190 });
    [450, 1000, 1600].forEach(ms => setTimeout(() => fx.burst({ x: W / 2, y: -10, angle: Math.PI / 2, spread: Math.PI, n: 70, power: 8, gravity: 0.16, life: 230 }), ms));
  }
  /** Big words that slam onto the whole screen for a moment. */
  function banner(big, sub, ms) {
    const el = document.createElement('div');
    el.className = 'banner';
    el.innerHTML = `<div><p class="banner-big">${words(big, true)}</p>${sub ? `<p class="banner-sub">${esc(sub)}</p>` : ''}</div>`;
    document.body.appendChild(el);
    sfx.slam();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, ms || 1300);
  }

  /* ================= Views ================= */
  let route = { name: 'home' };
  let busy = false;              // an animation owns the screen; hold re-renders until it ends
  const ui = { hostOpen: false, sidesOpen: false, addError: '', animRound: -1, enter: true, fresh: null, qr: '' };
  const canFull = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);
  let introSeen = store.get(LS_INTRO) === '1';

  function faceHTML(v, k) {
    if (v === SPIN) return `<div class="face f${k + 1} spinside">${ICON_WHEEL}<span class="tiny">Roulette</span></div>`;
    const star = k === STAR;
    return `<div class="face f${k + 1}${star ? ' star' : ''}${v === 0 ? ' zero' : ''}${v >= 1000 ? ' wide-num' : ''}">${star ? STAR_ICON : ''}<span>${peso(v)}</span></div>`;
  }
  const sideLabel = v => v === SPIN ? 'Roulette' : peso(v);

  function dieHTML(i, face, kind) {
    const sides = DICE[i].faces;
    // Legend dice sit star side forward; game dice wait on a middling side.
    const [rx, ry] = FACE_ROT[kind ? STAR : face == null ? START_FACE[i] : face];
    const settled = face != null && !kind;
    const star = settled && face === STAR, zero = settled && sides[face] === 0;
    return `<div class="die${kind ? ' ' + kind : ''}${settled ? ' settled' : ''}${star ? ' is-star' : ''}${zero ? ' is-zero' : ''}" data-die="${i}">
      <div class="die-stage"><div class="die-rays"></div><div class="die-glow"></div><div class="die-ring"></div>
        <div class="die-hop"><div class="die-tilt"><div class="cube" data-rx="${rx}" data-ry="${ry}" style="transform:rotateY(0deg) rotateX(${rx}deg) rotateY(${ry}deg)">${sides.map(faceHTML).join('')}</div></div></div></div>
      ${kind ? '' : `<div class="die-shadow"></div><div class="readout">${settled ? sideLabel(sides[face]) : ''}</div>`}
    </div>`;
  }

  const chipHTML = (v, i, star) => v === SPIN
    ? `<span class="chip wheelchip">${ICON_WHEEL}Roulette</span>`
    : `<span class="chip d${i + 1}${star ? ' star' : ''}${v === 0 ? ' zero' : ''}">${peso(v)}</span>`;
  const prizeLabel = w => w === BAGWIN ? 'Jackpot' : peso(w);
  const wheelChip = p => `<span class="chip wheelchip${wonBag(p) ? ' star' : ''}">${ICON_WHEEL}${prizeLabel(p.wheel.won)}</span>`;
  const resultChips = p => p.dice.map((v, k) => (k === 2 && p.wheel ? wheelChip(p) : chipHTML(v, k, isStar(p, k)))).join('');

  /* ---- the roulette wheel ---- */
  const WEDGE = { 1000: ['var(--ruby)', '#fff'], 0: ['var(--coal)', 'var(--muted)'], 100: ['var(--green)', '#fff'], bag: ['var(--gold)', 'var(--ink)'], 20: ['var(--ivory)', 'var(--ink)'], 500: ['var(--blue)', '#fff'], 50: ['var(--orange)', '#fff'] };
  const restAngle = w => { const a = 360 / w.slots.length; return -(w.slots.indexOf(w.won) + 0.5 + (w.j || 0)) * a; };
  const wheelFrame = (inner, rot, label) => `<svg class="wheel-svg" viewBox="-114 -120 228 236" role="img" aria-label="${esc(label)}">
      <circle r="110" fill="var(--wood)"/><circle r="107" fill="none" stroke="var(--gold)" stroke-width="3"/>
      <g class="wheel-rot" style="transform:rotate(${rot}deg)">${inner}</g>
      <g class="wheel-hub"><circle r="18" fill="var(--gold)" stroke="var(--gold-deep)" stroke-width="2.5"/><path transform="translate(-12 -12)" fill="var(--ink)" d="M12 2l2.47 6.6 7.04.31-5.52 4.39 1.89 6.79L12 16.2l-5.88 3.89 1.89-6.79-5.52-4.39 7.04-.31z"/></g>
      <path class="wheel-pin" d="M-11 -118h22L0 -92z" fill="var(--ruby)" stroke="var(--gold-light)" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>`;
  /** A wheel of names: equal wedges, each name written from the hub out to the rim. */
  function nameWheelSVG(names, rot) {
    const n = names.length, a = 360 / n, R = 100;
    const pt = (deg, r) => { const t = (deg - 90) * Math.PI / 180; return `${(r * Math.cos(t)).toFixed(2)} ${(r * Math.sin(t)).toFixed(2)}`; };
    const hues = [['var(--ruby)', '#fff'], ['var(--green)', '#fff'], ['var(--blue)', '#fff'], ['var(--orange)', '#fff'], ['var(--violet)', '#fff']];
    const wedges = names.map((name, i) => {
      let [fill, ink] = hues[i % hues.length];
      if (n > 1 && i === n - 1 && i % hues.length === 0) [fill, ink] = ['var(--ivory)', 'var(--ink)'];   // never the same colour as its neighbour
      const shape = n === 1 ? `<circle r="${R}" fill="${fill}"/>` : `<path d="M0 0L${pt(i * a, R)}A${R} ${R} 0 ${a > 180 ? 1 : 0} 1 ${pt((i + 1) * a, R)}Z" fill="${fill}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>`;
      const shown = name.length > 16 ? name.slice(0, 15) + '…' : name;
      const size = Math.min(n > 12 ? 11 : n > 8 ? 13.5 : n > 4 ? 17 : 21, 64 / (shown.length * 0.5)).toFixed(1);
      return `<g class="wedge">${shape}<text transform="rotate(${((i + 0.5) * a - 90).toFixed(2)})" x="93" text-anchor="end" dominant-baseline="central" font-size="${size}" fill="${ink}">${esc(shown)}</text></g>`;
    }).join('');
    const pegs = n > 1 ? names.map((x, i) => { const [cx, cy] = pt(i * a, 96).split(' '); return `<circle cx="${cx}" cy="${cy}" r="3.2" fill="var(--gold-light)"/>`; }).join('') : '';
    return wheelFrame(wedges + pegs, rot, 'Wheel of names: ' + names.join(', '));
  }
  function wheelSVG(slots, rot, won) {
    const n = slots.length, a = 360 / n, R = 100;
    const pt = (deg, r) => { const t = (deg - 90) * Math.PI / 180; return `${(r * Math.cos(t)).toFixed(2)} ${(r * Math.sin(t)).toFixed(2)}`; };
    const wedges = slots.map((s, i) => {
      const [fill, ink] = WEDGE[s];
      const shape = n === 1 ? `<circle r="${R}" fill="${fill}"/>` : `<path d="M0 0L${pt(i * a, R)}A${R} ${R} 0 ${a > 180 ? 1 : 0} 1 ${pt((i + 1) * a, R)}Z" fill="${fill}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>`;
      const size = s === BAGWIN ? (n > 5 ? 15 : 19) : (n > 5 ? 21 : 26);
      return `<g class="wedge${won === s ? ' won' : ''}">${shape}<text transform="rotate(${((i + 0.5) * a).toFixed(2)}) translate(0 -64)" text-anchor="middle" dominant-baseline="middle" font-size="${size}" fill="${ink}">${s === BAGWIN ? 'JACKPOT' : peso(s)}</text></g>`;
    }).join('');
    const pegs = n > 1 ? slots.map((s, i) => { const [x, y] = pt(i * a, 96).split(' '); return `<circle cx="${x}" cy="${y}" r="3.2" fill="var(--gold-light)"/>`; }).join('') : '';
    return wheelFrame(wedges + pegs, rot, 'Roulette wheel: ' + slots.map(prizeLabel).join(', '));
  }
  function wheelWrapHTML(p, done) {
    return `<div class="wheel-wrap${done ? ' still' : ''}">
      <p class="wheel-dice">${chipHTML(p.dice[0], 0, isStar(p, 0))}<span>+</span>${chipHTML(p.dice[1], 1, isStar(p, 1))}<span>+</span>${done ? wheelChip(p) : chipHTML(SPIN, 2)}</p>
      <div class="wheel ${done ? 'done' : 'ready'}">${wheelSVG(p.wheel.slots, done ? restAngle(p.wheel) : 0, done ? p.wheel.won : null)}</div>
      ${done ? '' : phoneOn() ? '<p class="hint">Pull down on the phone to spin.</p><button class="btn ghost spin-btn" type="button">Or spin from this screen</button>' : '<button class="btn primary big spin-btn" type="button">Spin the wheel</button>'}
    </div>`;
  }

  function header(home) {
    const [label, tone] = statusInfo();
    return `<header class="top${home ? ' on-home' : ''}">
      ${home ? '' : `<button class="brand" data-action="home" aria-label="Rivera Royale, back to the lobby">${PAROL}<span>Rivera <em class="foil">Royale</em></span></button>`}
      <div class="top-tools">
        <span id="sync-pill" class="pill ${tone}"${sync.mode === 'local' ? ' hidden' : ''}>${label}</span>
        ${phonePill()}
        ${canFull ? `<button class="icon-btn" data-action="full" aria-label="Full screen">${ICON_FULL}</button>` : ''}
        <button class="icon-btn${voice.talking() ? ' speaking' : ''}" id="sound-btn" data-action="sound" aria-pressed="${soundOn}" aria-label="${soundOn ? 'Sound is on. Tap to mute and stop the voice.' : 'Sound is off. Tap to turn it on.'}">${soundOn ? ICON_SOUND : ICON_MUTE}</button>
      </div>
    </header><div class="lights" aria-hidden="true"><i></i></div>`;
  }

  function legendHTML() {
    const dice = DICE.map((d, i) => `<li>${dieHTML(i, null, 'mini')}<div class="sides"><b>Die ${i + 1}</b><span class="how">${d.faces.map((v, k) => chipHTML(v, i, k === STAR)).join('')}</span></div></li>`).join('');
    const left = wheelNow(state);
    return `<ul class="legend">${dice}
      <li><span class="wheel-mini">${ICON_WHEEL}</span><div class="sides"><b>Still on the roulette</b><span class="how">${left.map(w => `<span class="chip wheelchip${w === BAGWIN ? ' star' : ''}">${prizeLabel(w)}</span>`).join('')}</span></div></li>
    </ul>`;
  }

  function viewHome() {
    const P = state.players, f = state.finale;
    const waiting = P.filter(p => p.status === 'waiting');
    const done = P.filter(p => p.status !== 'waiting').sort((a, b) => worth(b) - worth(a) || a.at - b.at);
    const rolled = P.filter(p => p.status === 'rolled');
    const kept = P.filter(p => p.status === 'kept');
    const locked = !sync.ready || sync.readOnly;
    const dis = locked ? ' disabled' : '';
    const stale = done.some(p => !current(p));

    let next;
    if (f) {
      next = '<p class="note">The dice are closed. The show has ended.</p>';
    } else {
      const chips = waiting.map(p => `<span class="name-chip">${esc(p.name)}</span>`).join('');
      const lost = !P.length && Array.isArray(state.lastRoster) ? state.lastRoster.length : 0;
      const hint = !P.length
        ? `<p class="note">Nobody’s on the list yet. Add everyone who’s playing, then spin to see who goes first.</p>${lost ? `<div><button class="btn ghost" data-action="restore-names"${dis}>Bring back the last list (${lost} ${lost === 1 ? 'name' : 'names'})</button></div>` : ''}`
        : (!waiting.length ? '<p class="note">Everyone on the list has played. Add a name if someone’s missing.</p>' : '');
      const spinNext = waiting.length
        ? `<div class="spin-next"><button class="btn primary big" data-action="pick"${dis}>${waiting.length > 1 ? 'Spin for the next player' : `Last up: ${esc(waiting[0].name)}`}</button>
            ${waiting.length > 1 ? '<p class="fine">The wheel decides the order, so everyone has the same chance at the roulette prizes.</p>' : ''}</div>` : '';
      next = `${spinNext}${chips ? `<div class="chips">${chips}</div>` : ''}${hint}
        <form id="add-form" class="add" novalidate>
          <label class="sr" for="new-name">Name to add</label>
          <input id="new-name" name="name" type="text" maxlength="600" placeholder="Add a name, or several with commas" autocomplete="off" autocapitalize="words" enterkeyhint="done"${dis}>
          <button class="btn ghost" type="submit"${dis}>Add</button>
        </form>
        ${ui.addError ? `<p class="error" role="alert">${esc(ui.addError)}</p>` : ''}`;
    }

    const rows = done.map((p, i) => {
      const how = p.status === 'kept' ? `<span class="how">Pera. Took the ${peso(STAKE)}</span>` : `<span class="how">${resultChips(p)}</span>`;
      let amt;
      if (tookBag(p)) amt = `<span class="amt up"><s>${peso(p.total)}</s><small>Mystery Bag</small></span>`;
      else amt = `<span class="amt${worth(p) > STAKE ? ' up' : ''}">${peso(worth(p))}${wonBag(p) ? '<small>+ Mystery Bag</small>' : ''}</span>`;
      let fresh = '';
      if (ui.fresh && ui.fresh.id === p.id) {
        if (!ui.fresh.at) ui.fresh.at = Date.now();
        const gone = Date.now() - ui.fresh.at;
        if (gone < 2200) fresh = ` fresh" style="animation-delay:-${gone}ms`;
      }
      return `<li class="row${fresh}"><span class="rank">${i === 0 ? CROWN : i + 1}</span><span class="who"><b>${esc(p.name)}</b>${how}</span>${amt}</li>`;
    }).join('');
    const pips = P.map((p, i) => `<i${i < done.length ? ' class="on"' : ''}></i>`).join('');
    const record = done.length
      ? `<div class="progress"><span class="pips" aria-hidden="true">${pips}</span><span>${done.length} of ${P.length} played</span></div><ol class="record">${rows}</ol>`
      : '<p class="note">Results land here as each person takes the money or rolls.</p>';

    // The lobby never says what the ending holds: until the credits have rolled it is just "the end of the show".
    const revealed = !!f && f.stage === 'revealed';
    const twist = revealed && (f.picked.length > 0 || !!f.pending);     // the surprise is out in the open
    let fin;
    if (f) {
      const open = !revealed || !!f.pending || f.picked.some(id => !f.decisions[id]);
      fin = `<p>${!revealed ? 'The dice are closed. Time for the ending.' : open ? 'One more thing is under way.' : 'That’s a wrap. Maligayang Pasko!'}</p>
        <button class="btn primary" data-action="finale">${!revealed ? 'Roll the credits' : open ? 'Continue' : 'See the ending'}</button>`;
    } else {
      fin = `<p>When everyone has had their turn, close the dice and roll the credits.</p>
        ${waiting.length && done.length ? `<p class="note">Still to play: ${esc(list(waiting.map(p => p.name)))}.</p>` : ''}
        <button class="btn primary" data-action="start-finale" data-confirm="Tap again. This closes the dice."${done.length && !locked ? '' : ' disabled'}>End the show</button>
        ${done.length ? '' : '<p class="fine">Opens once someone has played.</p>'}`;
    }

    const paid = rolled.filter(p => !tookBag(p)).reduce((s, p) => s + p.total, 0);
    const jackpotBy = rolled.find(wonBag);
    const swapped = rolled.filter(tookBag);
    const manage = P.map(p => {
      const what = p.status === 'waiting' ? 'Hasn’t played' : p.status === 'kept' ? `Took the ${peso(STAKE)}` : `Rolled ${peso(p.total)}${wonBag(p) ? ' + Mystery Bag' : ''}`;
      const lock = f || locked ? ' disabled' : '';
      return `<li><span class="m-name"><b>${esc(p.name)}</b><small>${what}</small></span><span class="m-acts">
        ${p.status !== 'waiting' ? `<button class="btn quiet" data-action="redo" data-id="${p.id}" data-confirm="Tap again to clear this turn"${lock}>Redo turn</button>` : `<button class="btn quiet" data-action="turn" data-id="${p.id}"${lock}>Call up</button>`}
        <button class="btn quiet" data-action="remove" data-id="${p.id}" data-confirm="Tap again to remove"${lock}>Remove</button>
      </span></li>`;
    }).join('');
    const srcs = voice.sources();
    const srcLabel = k => (k === 'claude' ? 'Claude voice' : voice.hasFilipino() ? 'This device’s Filipino voice' : 'This device’s voice');
    const sourcePick = srcs.length > 1 && !voice.blocked()
      ? `<div class="voice-pick">${srcs.map(k => `<button class="btn quiet${k === voice.kind() ? ' on' : ''}" data-action="voice-source" data-source="${k}">${srcLabel(k)}</button>`).join('')}</div>` : '';
    const voices = voice.kind() === 'claude' && !voice.blocked()
      ? `<div class="voice-pick">${voice.NAMES.map(v => `<button class="btn quiet${v === voice.name() ? ' on' : ''}" data-action="voice" data-voice="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>` : '';
    let phoneBox = '';
    if (hasHost) {
      phoneBox = '<p class="fine">Dice phone: to throw the dice by shaking a second phone, open the game at its own web address. It can’t run inside Claude.</p>';
    } else if (canLink) {
      const st = link.status();
      phoneBox = st === 'off'
        ? `<div class="phone-box"><p><b>Dice phone.</b> Use a second phone as the dice: shake it, make a throwing motion, and the dice land on this screen.</p>
            <div><button class="btn quiet" data-action="phone-on">Connect a phone</button></div></div>`
        : `<div class="phone-box"><p><b>Dice phone:</b> ${st === 'on' ? 'connected.' : st === 'failed' ? 'can’t reach the connection service. Check the internet. Still trying.' : 'waiting for the phone. Scan this with the phone’s camera.'}</p>
            <div class="qr-box">${ui.qr}<div><p class="fine">Or open this address on the phone:</p><p class="qr-url">${esc(pairUrl())}</p></div></div>
            <div><button class="btn quiet" data-action="phone-off">Disconnect the phone</button></div></div>`;
    }
    const host = `<details class="host"${ui.hostOpen ? ' open' : ''}>
      <summary>Host tools</summary>
      <div class="host-body">
        <dl class="tally">
          <div><dt>Dice winnings to pay out</dt><dd>${peso(paid)}</dd></div>
          <div><dt>Pera: took the ${peso(STAKE)}</dt><dd>${kept.length} × ${peso(STAKE)} = ${peso(kept.length * STAKE)}</dd></div>
          <div><dt>Roulette jackpot bag</dt><dd>${jackpotBy ? esc(jackpotBy.name) : 'Still on the wheel'}</dd></div>
          ${twist ? `<div><dt>Lowest-roller bag</dt><dd>${swapped.length ? esc(list(swapped.map(p => p.name))) : 'Not given yet'}</dd></div>` : ''}
        </dl>
        ${phoneBox}
        <div class="voice-box">
          ${sourcePick}
          <p class="fine">${esc(voice.describe())}</p>
          ${voices}
          <div class="danger">
            ${voice.kind() !== 'none' && !voice.blocked() ? '<button class="btn quiet" data-action="voice-test">Test the voice</button>' : ''}
            <button class="btn quiet" data-action="intro">Play the show intro</button>
          </div>
        </div>
        ${manage ? `<ul class="manage">${manage}</ul>` : ''}
        ${f ? '<p class="fine">Undo the ending to change or remove a turn.</p>' : ''}
        <div class="danger">
          ${f ? `<button class="btn quiet" data-action="undo-finale" data-confirm="Tap again to undo the ending"${dis}>Undo the ending</button>` : ''}
          ${done.length || f ? `<button class="btn quiet" data-action="clear-results" data-confirm="Tap again to clear all results"${dis}>Clear results, keep the names</button>` : ''}
        </div>
        <p class="fine">${storageNote()}</p>
        <div class="danger"><button class="btn quiet" data-action="reset" data-confirm="Tap again. This deletes the names too."${dis}>Delete all names and results</button></div>
      </div>
    </details>`;

    const opener = !introSeen && !done.length
      ? `<div class="open-show"><button class="btn primary big" data-action="intro">Start the show</button><p class="fine">Plays the intro with the rules. Turn the volume up.</p></div>` : '';
    const staleBox = stale
      ? `<div class="stale"><p><b>These results are from an earlier version of the game.</b> Clear them before the real show so everyone plays the same dice.</p>
          <div><button class="btn quiet" data-action="clear-results" data-confirm="Tap again to clear all results"${dis}>Clear results, keep the names</button></div></div>` : '';

    return `<div class="hero"><span class="lantern">${PAROL}</span>${logoHTML()}<span class="lantern b">${PAROL}</span></div>
      <p class="lede">The Rivera Christmas special. ${peso(STAKE)} cash in your hand, or three dice that pay ${peso(MIN_TOTAL)} to ${peso(MAX_TOTAL)}.</p>
      ${opener}${staleBox}
      <div class="lobby">
        <div class="lobby-col">
          <section class="sec"><h2>Who’s next?</h2>${next}</section>
          <section class="card"><div class="card-head">${twist ? ICON_BAG : PAROL}<h2>${twist ? 'One more thing' : 'The end of the show'}</h2></div>${fin}</section>
        </div>
        <section class="sec"><h2>The record</h2>${record}</section>
      </div>
      ${host}`;
  }

  function viewPick() {
    const waiting = state.players.filter(p => p.status === 'waiting');
    return `<section class="pick">
      <button class="back" data-action="home">‹ The record</button>
      <h1>Who’s next?</h1>
      <div class="wheel ready" data-action="pick-spin">${nameWheelSVG(waiting.map(p => p.name), 0)}</div>
      ${phoneOn() ? '<p class="hint">Pull down on the phone to spin.</p><button class="btn ghost" data-action="pick-spin">Or spin from this screen</button>' : '<button class="btn primary big" data-action="pick-spin">Spin the wheel</button>'}
      <p class="fine">${waiting.length} still to play. Every name has the same chance.</p>
    </section>`;
  }

  function viewChoice(p) {
    return `<section class="choice">
      <button class="back" data-action="home">‹ Not my turn</button>
      <div class="ask">
        <h1 class="ask-name foil slam">${esc(p.name)}</h1>
        <p class="ask-q"><span class="slam" style="--i:4">Pera</span><i class="slam" style="--i:6">o</i><span class="slam foil" style="--i:8">Kapalaran?</span></p>
        ${phoneOn() ? '<p class="hint via-note">The answer is on the phone.</p>' : ''}
      </div>
      <div class="doors">
        <div class="door">
          <div class="door-art"><div class="bill" aria-hidden="true"><small>Pamasko</small>${peso(STAKE)}</div></div>
          <h2>Pera</h2>
          <p>Take ${peso(STAKE)} cash. RJ hands it over right now.</p>
          <button class="btn ghost big wide" data-action="keep" data-id="${p.id}" data-confirm="Final answer? Tap again for Pera">Pera</button>
        </div>
        <div class="door fate">
          <div class="door-art" aria-hidden="true">${DICE.map((d, i) => dieHTML(i, null, 'mini')).join('')}</div>
          <h2 class="foil">Kapalaran</h2>
          <p>Leave the ${peso(STAKE)} and roll three dice for ${peso(MIN_TOTAL)} to ${peso(MAX_TOTAL)}.</p>
          <button class="btn primary big wide" data-action="to-roll" data-id="${p.id}">Kapalaran</button>
        </div>
      </div>
      <details class="sides-info"${ui.sidesOpen ? ' open' : ''}><summary>What’s on the dice?</summary>${legendHTML()}</details>
    </section>`;
  }

  function verdict(p) {
    if (p.wheel) {
      const w = p.wheel.won;
      if (w === BAGWIN) return 'Jackpot! The Mystery Bag.';
      if (w === 0) return 'The roulette says zero.';
      return `The roulette pays ${peso(w)}!`;
    }
    const stars = [0, 1, 2].filter(i => isStar(p, i)).length;
    if (isStar(p, 2)) return stars === 3 ? 'All three star sides. The best roll there is!' : `The ${peso(1000)} side!`;
    if (p.dice[2] === 0) return 'The last die came up empty.';
    if (stars === 2) return 'Two star sides.';
    if (stars === 1) return 'One star side.';
    return 'No star sides this time.';
  }
  const isBig = p => isStar(p, 2) || (!!p.wheel && (p.wheel.won === BAGWIN || p.wheel.won >= 500));

  function resultHTML(p) {
    const parts = p.dice.map((v, i) => (i === 2 && p.wheel ? `${wonBag(p) ? 'the Jackpot' : peso(v)} from the roulette` : peso(v)));
    return `<div class="result" aria-live="polite">
      <p class="sum">${parts.join(' + ')}</p>
      <p class="verdict${isBig(p) ? ' big foil' : ''}">${verdict(p)}</p>
      <p class="payout">RJ pays ${esc(p.name)} ${peso(p.total)}${wonBag(p) ? ' and the Mystery Bag' : ''}</p>
      <button class="btn primary wide" data-action="home">Pass it on</button>
    </div>`;
  }
  // A result rolled under the current dice can show its dice again.
  const canShowDice = p => current(p) && !!p.faces && p.faces.every((f, i) => (DICE[i].faces[f] === SPIN ? !!p.wheel : DICE[i].faces[f] === p.dice[i]));

  function viewRoll(p) {
    if (p.status === 'rolled') {
      const stage = !canShowDice(p) ? '' : p.wheel ? wheelWrapHTML(p, true) : `<div class="tray">${p.faces.map((fc, i) => dieHTML(i, fc)).join('')}</div>`;
      return `<section class="roll is-done${isBig(p) ? ' is-jackpot' : ''}">
        <h1>${esc(p.name)}</h1>
        <div class="score"><span class="score-label">takes home</span><span class="total-amt foil">${peso(p.total)}</span>${wonBag(p) ? '<span class="total-plus">+ the Mystery Bag</span>' : ''}</div>
        ${stage}
        ${resultHTML(p)}
      </section>`;
    }
    const viaPhone = phoneOn();
    return `<section class="roll is-ready${viaPhone ? ' via-phone' : ''}" data-action="roll">
      <button class="back" data-action="turn" data-id="${p.id}">‹ Changed my mind</button>
      <h1>${esc(p.name)}</h1>
      <div class="score"><span class="score-label">giving up</span><span class="total-amt stake">${peso(STAKE)}</span></div>
      <div class="tray">${DICE.map((d, i) => dieHTML(i, null)).join('')}${viaPhone ? `<div class="in-phone">${ICON_PHONE}<b>The dice are in the phone</b></div>` : ''}</div>
      <div class="roll-cta">
        <p class="hint">${viaPhone ? 'Shake the phone, then throw at the screen.' : 'Tap anywhere to roll. Hold to shake first.'}</p>
        <button class="btn ${viaPhone ? 'ghost' : 'primary'}" data-action="roll">${viaPhone ? 'Or roll from this screen' : 'Roll the dice'}</button>
        <p class="fine">No take-backs once the dice are out.</p>
      </div>
    </section>`;
  }

  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const pipCells = n => Array.from({ length: 9 }, (_, i) => `<i${PIPS[n].includes(i) ? ' class="on"' : ''}></i>`).join('');
  const pipDie = n => `<span class="pip-die" role="img" aria-label="Rolled ${n}">${pipCells(n)}</span>`;
  const spots = n => n === 1 ? 'one Mystery Bag' : `${n} Mystery Bags`;

  /** Rollers who could still be offered a Mystery Bag, lowest first. */
  function bagPool(s) {
    const f = s.finale;
    return s.players.filter(p => p.status === 'rolled' && !(p.wheel && p.wheel.won === BAGWIN) && !(f && f.picked.includes(p.id))).sort((a, b) => a.total - b.total || a.at - b.at);
  }

  function viewFinale() {
    const f = state.finale;
    const nameOf = id => { const p = player(id); return p ? p.name : 'Someone'; };
    const anim = ui.animRound;
    const locked = !sync.ready || sync.readOnly;
    const dis = locked ? ' disabled' : '';
    if (f.stage !== 'revealed') {
      return `<section class="finale"><button class="back" data-action="home">‹ The record</button>
        <div class="wrapup"><h1>That’s the show</h1><p class="note">The dice are closed.</p>
          <button class="btn primary big" data-action="credits"${dis}>Roll the credits</button></div></section>`;
    }
    let html = `<section class="finale">
      <button class="back" data-action="home">‹ The record</button>
      <h1>${f.picked.length || f.pending ? 'One more thing' : 'That’s the show'}</h1>`;

    f.rounds.forEach((r, n) => {
      const live = anim === n;
      const cells = r.ids.map(id => {
        const st = r.in.includes(id) ? ['in', 'Gets the offer'] : r.tied.includes(id) ? ['again', 'Rolls again'] : ['out', 'Out'];
        return `<li class="contender${live ? '' : ' ' + st[0]}">${pipDie(r.rolls[id])}<b>${esc(nameOf(id))}</b><span class="tag">${live ? '' : st[1]}</span></li>`;
      }).join('');
      html += `<div class="round" data-round="${n}">
        <h2>Roll-off ${n + 1}</h2>
        <p class="fine">${r.ids.length} tied for ${spots(r.slots)}. The lowest ${r.slots === 1 ? 'roll gets' : 'rolls get'} the offer.</p>
        <ul class="contenders">${cells}</ul>
      </div>`;
    });

    if (anim >= 0) return html + '</section>';

    if (f.pending) {
      const names = f.pending.ids.map(nameOf);
      const tiedAt = player(f.pending.ids[0]);
      const again = f.rounds.length && f.rounds[f.rounds.length - 1].tied.length;
      html += `<div class="round">
        <p><b>${esc(list(names))}</b> are ${again ? 'still tied' : `tied at ${peso(tiedAt ? tiedAt.total : MIN_TOTAL)}`} for ${spots(f.pending.slots)}. Each rolls one die. The lowest ${f.pending.slots === 1 ? 'roll gets' : 'rolls get'} the offer.</p>
        <button class="btn primary wide" data-action="roll-off"${dis}>${again ? 'Roll again' : 'Roll off'}</button>
      </div>`;
      return html + '</section>';
    }

    html += f.picked.map(id => {
      const p = player(id);
      if (!p) return '';
      const d = f.decisions[id];
      if (d) {
        return `<div class="offer done"><div class="offer-head">${d === 'bag' ? ICON_BAG : ''}<div><h2>${esc(p.name)}</h2>
          <p>${d === 'bag' ? `Handed back ${peso(p.total)} for the Mystery Bag.` : `Kept the ${peso(p.total)}.`}</p></div></div></div>`;
      }
      return `<div class="offer"><div class="offer-head">${ICON_BAG}<div><h2>${esc(p.name)}, you rolled ${peso(p.total)}</h2>
        <p>Pera o Mystery Bag? Keep it, or hand it back for the bag. Nobody knows what’s inside.</p></div></div>
        <div class="offer-acts">
          <button class="btn ghost" data-action="decide" data-id="${id}" data-choice="cash" data-confirm="Tap again to keep ${peso(p.total)}"${dis}>Keep ${peso(p.total)}</button>
          <button class="btn primary" data-action="decide" data-id="${id}" data-choice="bag" data-confirm="Tap again to take the bag"${dis}>Take the Mystery Bag</button>
        </div></div>`;
    }).join('');

    if (!f.picked.length) html += '<p class="closing foil">Maligayang Pasko!</p><button class="btn ghost wide" data-action="home">Back to the record</button>';
    if (f.picked.length && f.picked.every(id => f.decisions[id])) {
      const jackpotOpen = !state.players.some(wonBag);
      if (jackpotOpen && f.slots < 2 && bagPool(state).length) {
        html += `<div class="round"><p><b>Nobody won the roulette Jackpot,</b> so its Mystery Bag is still on the table.</p>
          <button class="btn ghost wide" data-action="offer-next"${dis}>Offer it to the next lowest roller</button></div>`;
      }
      html += '<p class="closing foil">Now that’s the show. Maligayang Pasko!</p><button class="btn ghost wide" data-action="home">Back to the record</button>';
    }
    return html + '</section>';
  }

  function render() {
    if (busy) return;
    const old = document.getElementById('new-name');
    const typed = old ? old.value : '';
    const hadFocus = !!old && document.activeElement === old;

    let body;
    const p = route.id ? player(route.id) : null;
    if (route.name === 'choice' && p && p.status === 'waiting' && !state.finale) body = viewChoice(p);
    else if (route.name === 'roll' && p && (p.status === 'rolled' || (p.status === 'waiting' && !state.finale))) body = viewRoll(p);
    else if (route.name === 'finale' && state.finale) body = viewFinale();
    else if (route.name === 'pick' && !state.finale && state.players.some(x => x.status === 'waiting')) body = viewPick();
    else { route = { name: 'home' }; body = viewHome(); }
    $app.innerHTML = `${header(route.name === 'home')}<main class="view${ui.enter ? ' enter' : ''}">${body}</main>`;
    ui.enter = false;

    const input = document.getElementById('new-name');
    if (input) { input.value = typed; if (hadFocus) input.focus(); }
    wheelWaiting = route.name === 'pick' ? power => actions['pick-spin'](power) : null;     // a pull on the dice phone spins it too
    tellPhone();
  }
  function go(r, keepFresh) {
    route = r;
    ui.addError = '';
    ui.enter = true;
    if (!keepFresh) ui.fresh = null;
    render();
    window.scrollTo(0, 0);
  }

  /* ================= Full-screen sequences: the intro and the ending ================= */
  let showing = null;
  const waitMs = ms => new Promise(r => setTimeout(r, ms));

  /** Plays a list of beats full screen. Spoken beats follow the announcer line by line; silent beats hold for a set time. */
  function playShow(beats, label, onDone) {
    if (showing) return;
    const el = document.createElement('div');
    el.className = 'show';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', label);
    el.innerHTML = `<div class="show-rays"></div><div class="show-stage"></div>
      <div class="show-foot"><span class="show-dots">${beats.map(() => '<i></i>').join('')}</span>
        <span class="show-acts"><button class="btn quiet" type="button" data-show="next">Next</button><button class="btn quiet" type="button" data-show="skip">Skip</button></span></div>`;
    document.body.appendChild(el);
    const stage = el.querySelector('.show-stage'), dots = [...el.querySelectorAll('.show-dots i')];
    let at = -1, run = 0, over = false;

    const finish = () => {
      if (over) return;
      over = true;
      run += 1;
      voice.stop();
      el.remove();
      showing = null;
      onDone();
    };
    const show = k => {
      if (over || k <= at || k >= beats.length) return;
      at = k;
      const b = beats[k];
      el.classList.toggle('dark', !!b.dark);
      stage.className = 'show-stage' + (b.cls ? ' ' + b.cls : '');
      stage.innerHTML = b.html || `${b.kicker ? `<p class="show-kicker">${esc(b.kicker)}</p>` : ''}<div class="show-art">${b.art || ''}</div>
        ${b.big ? `<h1 class="show-big">${words(b.big, b.foil)}</h1>` : ''}${b.vo ? `<p class="show-cap">${esc(untag(b.vo))}</p>` : ''}`;
      dots.forEach((d, i) => d.classList.toggle('on', i <= k));
      const sound = sfx[b.sound || 'slam'];
      if (sound) sound(b.soundFor);
      if (b.party) bigShow();
    };
    const play = async from => {
      const mine = ++run;
      const live = () => !over && run === mine;
      let i = from;
      while (i < beats.length && live()) {
        if (!beats[i].vo) { show(i); await waitMs(beats[i].hold || 2500); i += 1; continue; }
        let j = i;
        while (j < beats.length && beats[j].vo) j += 1;       // a run of spoken beats is one reading
        const base = i;
        show(i);
        const spoke = await voice.script(beats.slice(i, j).map(b => b.vo), k => { if (live()) show(base + k); });
        if (!live()) return;
        if (spoke) { show(j - 1); await waitMs(900); }
        else for (let k = Math.max(at, base); k < j && live(); k++) { show(k); await waitMs(voice.guess(beats[k].vo)); }   // no voice: read the captions
        i = j;
      }
      if (live()) finish();
    };
    el.addEventListener('click', e => {
      const act = e.target.closest('[data-show]');
      if (!act) return;
      if (act.dataset.show === 'skip' || at + 1 >= beats.length) { finish(); return; }
      voice.stop();            // moving on by hand: the announcer picks up from the next beat
      play(at + 1);
    });
    showing = { finish };
    tellPhone();
    play(0);
  }

  function introBeats() {
    const named = re => state.players.filter(p => re.test(p.name)).map(p => p.name);
    const lola = named(/^lola\b/i)[0], titos = named(/^tito\b/i);

    return [
      { kicker: 'Live from the Rivera sala', big: lola ? `Mga Tito. Mga Tita. At si ${lola}.` : 'Mga Tito. Mga Tita. Mga pamangkin.', art: '<div class="on-air">On air</div>',
        vo: `Ladies and gentlemen. Mga Tito. Mga Tita. ${lola ? `And the one and only, ${lola}.` : 'And all the cousins in the back.'} Please put down your plates. This is important.` },

        vo: 'Every year, RJ brings the lechon ulo. This year... walang lechon ulo. Para sa puso natin. Instead, he built you an entire game show. Simple daw.' },

        vo: 'But first, one question. Pera... o kapalaran? Money... or destiny? Take the three hundred and sit back down. Or leave it on the table... and roll.' },
      { kicker: 'Kapalaran', big: 'Three dice. Add them up.', art: showDice,
        vo: 'Three dice. Whatever they add up to, RJ pays you. It could be seventy pesos. It could be more than one thousand. No pressure.' },
      { kicker: 'On the last die', big: `One side pays ${peso(1000)}. One pays nothing.`, art: `<div class="flats"><div class="flat star">${STAR_ICON}<span>${peso(1000)}</span></div><div class="flat zero"><span>${peso(0)}</span></div></div>`,
        vo: 'On the last die, one side is worth one thousand pesos. And one side is worth exactly zero. We do not talk about that side.' },
      { kicker: 'And one side opens', big: 'The roulette', art: `<div class="forever">${wheelSVG(WHEEL, 0, null)}</div>`,
        vo: `And one side opens the roulette. More cash... or the jackpot. But every prize on that wheel can only be won once. So the early birds get the worm. Sorry, ${tito}.` },
      { kicker: 'House rules', big: 'No take-backs. No crying. No utang.',
        vo: 'House rules. No take-backs. No crying. And no, you cannot pay your utang with your winnings. Okay... maybe you can.' },
      { kicker: 'Phones down. Prayers up.', big: 'Let’s play!', art: logoHTML(), sound: 'fanfare',
        vo: 'So. Phones down. Prayers up. Let’s play... Rivera Royale!' },
